services:
  - type: web
    name: de-power-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy only after the GitHub Actions tests for the commit are green.
    # Applies when the service is managed by this Blueprint; otherwise set
    # Settings -> Build & Deploy -> Auto-Deploy = "After CI Checks Pass".
    autoDeployTrigger: checksPass
    envVars:
      - key: ENTSOE_API_KEY
        sync: false
      - key: ENTSOE_ENDPOINT_URL
        value: https://web-api.tp.entsoe.eu/api
      - key: ENTSOE_REFRESH_SECONDS
        value: "300"
      - key: ENTSOE_CACHE_SECONDS
        value: "240"
      - key: ENTSOE_CACHE_MAX_ENTRIES
        value: "256"
      - key: ENTSOE_HTTP_TIMEOUT
        value: "35"
      - key: ENTSOE_MAX_REQUESTS_PER_MINUTE
        value: "300"
      - key: ENTSOE_PAST_DAY_CACHE_SECONDS
        value: "3600"
      - key: LOG_LEVEL
        value: INFO
      # Background refresh of today's panels (keep the service awake with an
      # uptime monitor on /health on the free plan).
      - key: BACKGROUND_REFRESH
        value: "1"
      - key: STALE_MAX_SECONDS
        value: "1800"
      # v5.4: preliminary imbalance from netztransparenz RZ-Saldo. Managed in
      # the dashboard (sync: false) so "0" there switches it off reliably;
      # unset = on.
      - key: NTP_IMBALANCE_NOWCAST
        sync: false
      # Strongly recommended: without these the dashboard (and your ENTSO-E
      # request budget) is open to anyone who finds the URL.
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # Optional: Germany-wide NRV-Saldo and aFRR/mFRR incl. Amprion.
      # Free credentials: https://extranet.netztransparenz.de (OAuth client).
      - key: NTP_CLIENT_ID
        sync: false
      - key: NTP_CLIENT_SECRET
        sync: false
